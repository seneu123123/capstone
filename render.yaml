services:
  # Laravel Web Service
  - type: web
    name: voyagecraft-laravel-api
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: voyagecraft-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: voyagecraft-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: voyagecraft-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: voyagecraft-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: voyagecraft-postgres
          property: password

  # Managed PostgreSQL Database on Render
  - type: postgres
    name: voyagecraft-postgres
    plan: free
    region: singapore
    databaseName: voyagecraft_capstone
    user: voyagecraft_user
